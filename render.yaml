# Render Blueprint for the Cortech BD dashboard — THE source of truth for both
# Render services. Create and change services by editing this file and
# syncing the Blueprint. Do not create or edit services by hand in the UI.
#
# ┌─ WHY THIS FILE EXISTS ────────────────────────────────────────────────────┐
# │ Three deploys failed on 2026-09-21, all from a Start Command typed into  │
# │ a form:                                                                   │
# │   1. Docker web service, no Start Command → image CMD was bare main.py, │
# │      the discovery scheduler; it ran a full pipeline pass on boot.       │
# │   2. Worker command deployed under a Web Service → binds no port →       │
# │      "No open ports detected" forever, no UI anywhere.                    │
# │   3. Web service recreated by hand → Start Command mistyped → failed.     │
# │ The command strings below are verified (see docs/DASHBOARD.md §6) and   │
# │ tests/test_render_yaml.py fails CI if either service drifts.             │
# │   web    (type: web)    uvicorn dashboard.app:app --host 0.0.0.0 --port $PORT │
# │   worker (type: worker) python -m dashboard.worker                        │
# │   NEVER `python main.py` in any Render service.                           │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Field names follow render.com/docs/blueprint-spec (read 2026-09-21):
#   * Docker-runtime services use `dockerCommand`, not `startCommand`
#     (`startCommand` is for native runtimes and is ignored for docker).
#   * Every envVars entry needs a value source: `value`, `sync: false`
#     (set once in the Render dashboard, never committed) or `generateValue`.
#     A bare `key:` is a spec error.
#   * `PORT` is NOT declared here. Render sets it for every web service
#     (default 10000); the web command reads it via "${PORT:-10000}".
#     Verified locally: PORT=8766 → "Uvicorn running on http://0.0.0.0:8766".
#
# Two services, both stateless — every piece of real state is in the existing
# Supabase project, so either can restart or redeploy without losing anything.
# Both build the SAME image from ./Dockerfile and differ only in the command.
#
#   cortech-bd-dashboard  type: web     dashboard UI + thin API   (binds $PORT)
#   cortech-bd-worker     type: worker  runs dashboard-triggered jobs  (no port)
#
# Nothing here replaces the existing discovery schedule (systemd timers). See
# docs/DASHBOARD.md §"Scheduler" and the opt-in Render Cron block at the end.
#
# Plan names are the current spec names (Render renamed plans in Aug 2026):
#   0.5c-512mb = legacy "starter" ($7/mo)     1c-2g = legacy "standard" ($25/mo)

services:
  # ── Web service: the dashboard UI + API ─────────────────────────────────────
  # Binds $PORT. This is the ONLY service Render should scan for an open port.
  # First log line must read "IDENTITY: cortech-bd-web".
  - type: web
    name: cortech-bd-dashboard
    runtime: docker              # same image as the worker; only the command differs
    region: frankfurt            # closest Render region to the Supabase project (eu-west-1)
    plan: 0.5c-512mb             # 0.5 CPU / 512 MB — $7/mo. `free` spins down after 15 idle min.
    branch: main
    dockerfilePath: ./Dockerfile
    # Verified 2026-09-21 (docs/DASHBOARD.md §6): binds 0.0.0.0:$PORT, /healthz → 200.
    # `sh -c` so $PORT (injected by Render) is expanded inside the container.
    dockerCommand: sh -c 'exec uvicorn dashboard.app:app --host 0.0.0.0 --port "${PORT:-10000}" --proxy-headers --forwarded-allow-ips="*"'
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # ── Required: database. The web reads and writes Supabase only. ──
      # It does NOT need ANTHROPIC/OPENAI/AIRTABLE keys: verified 2026-09-21 by
      # booting it with only these two + the auth vars set (healthz 200, UI
      # redirects to login). config.require_env() is called by the worker and
      # main.py, never by dashboard.app. Least privilege: the internet-facing
      # process holds no model or CRM credentials.
      - key: SUPABASE_URL
        sync: false               # set in the Render dashboard; never committed
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ── Required: Google login (WEB ONLY — the worker never sees these) ──
      # Names are exactly what dashboard/settings.py reads.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true       # Render generates a random value; signs the session cookie
      - key: PUBLIC_BASE_URL
        sync: false               # Placeholder at creation: https://cortech-bd-dashboard.onrender.com
                                  # Render assigns the real hostname (often with a random suffix)
                                  # only when it creates the service. Then: copy the real URL from
                                  # the service page, set it here (no trailing slash), register
                                  # <URL>/auth/callback in Google, "Save and deploy".
                                  # docs/DASHBOARD.md §3.3 Step 5b.

      # ── Access policy ──
      - key: AUTH_ALLOWED_DOMAIN
        value: cortechconsultinggroup.com
      - key: AUTH_ALLOWED_EMAILS
        sync: false               # explicit off-domain exceptions, comma-separated full
                                  # addresses. Leave EMPTY unless a decision says otherwise
                                  # (docs/DASHBOARD.md §3.5). Empty = domain only.

      # ── Behaviour (defaults identical to dashboard/settings.py) ──
      - key: DASHBOARD_SESSION_MAX_AGE
        value: "43200"            # seconds; 12 h
      - key: DASHBOARD_COOKIE_SECURE
        value: "true"
      - key: DASHBOARD_POLL_MS
        value: "15000"
      - key: DASHBOARD_TRIGGERS_ENABLED
        value: "true"             # "false" = read-only dashboard, no new jobs
      - key: DASHBOARD_BULK_MAX
        value: "40"
      # Mirror of the worker's values so the UI shows the enforced numbers.
      # Keep identical on both services.
      - key: DASHBOARD_AGGREGATE_CAP_USD
        value: "100"
      - key: DASHBOARD_AGGREGATE_WINDOW_HOURS
        value: "24"
      - key: DASHBOARD_HEARTBEAT_SECONDS
        value: "10"

  # ── Background worker: executes dashboard-triggered runs ────────────────────
  # `type: worker` = Render Background Worker. No port, no health check, no
  # inbound traffic — Render never port-scans it. Deploying this command under
  # `type: web` produces the endless "No open ports detected" loop.
  # First log lines must read "IDENTITY: cortech-bd-worker" then
  # "dashboard worker up (token …); aggregate cap 100.00 USD / 24h".
  - type: worker
    name: cortech-bd-worker
    runtime: docker
    region: frankfurt
    plan: 1c-2g                  # 1 CPU / 2 GB — $25/mo FLAT whether 1 or 50 drafts run.
                                 # Chromium + pdfplumber + PLAYWRIGHT_JS_HEAP_MB=512 do not
                                 # fit in 512 MB; workers have no free tier. Tier decision
                                 # still open: docs/DASHBOARD.md §3.6, options A/B/C.
    branch: main
    dockerfilePath: ./Dockerfile
    # Verified 2026-09-21 (docs/DASHBOARD.md §6): logs IDENTITY line, opens no port,
    # polls dashboard_triggers, exits cleanly on SIGTERM. Also the image's default CMD.
    dockerCommand: python -m dashboard.worker
    autoDeployTrigger: commit
    envVars:
      # ── Required: config.require_env() exits 1 at boot if any is missing ──
      # (verified: with only Supabase set → "Missing required environment
      # variables: ANTHROPIC_API_KEY, OPENAI_API_KEY", exit 1)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false               # embeddings (text-embedding-3-small)

      # ── CRM write-through (fail-open: missing = Airtable skipped, run continues) ──
      - key: AIRTABLE_API_KEY
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false

      # ── Review email (the existing human-review step at `drafted`) ──
      # submit_single_url() sends the internal review email exactly as the CLI
      # does. Empty EMAIL_RECIPIENTS suppresses it for dashboard AND cron alike.
      # Gmail (GMAIL_ADDRESS + GMAIL_APP_PASSWORD) or Resend (RESEND_API_KEY +
      # EMAIL_SENDER) — fill one pair, leave the other empty.
      - key: EMAIL_RECIPIENTS
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_SENDER
        sync: false

      # ── Spend caps: per run (ADR 012) and aggregate across dashboard runs ──
      # Both are enforced by THIS process. Zero is a valid hard stop.
      - key: MAX_RUN_COST_USD
        value: "25"
      - key: DASHBOARD_AGGREGATE_CAP_USD
        value: "100"              # keep identical to the web service's copy
      - key: DASHBOARD_AGGREGATE_WINDOW_HOURS
        value: "24"

      # ── Pipeline tuning (same defaults as config.py / .env.example) ──
      - key: ANTHROPIC_TIMEOUT_SECONDS
        value: "180"
      - key: ANTHROPIC_MAX_RETRIES
        value: "2"
      - key: DOCUMENT_DOWNLOAD_TIMEOUT_SECONDS
        value: "60"
      - key: DOCUMENT_DOWNLOAD_MAX_RETRIES
        value: "2"
      - key: MAX_DOWNLOAD_REDIRECTS
        value: "5"
      - key: MAX_DOCUMENT_BYTES
        value: "26214400"         # 25 MiB — source URLs are untrusted, keep finite
      - key: MAX_DOCUMENT_UNCOMPRESSED_BYTES
        value: "104857600"        # 100 MiB
      - key: MAX_EXTRACTED_TEXT_CHARS
        value: "120000"
      - key: MAX_GDRIVE_FILES
        value: "25"
      - key: PLAYWRIGHT_TIMEOUT_MS
        value: "45000"
      - key: PLAYWRIGHT_JS_HEAP_MB
        value: "512"
      - key: FULL_DRAFT_FOR_WATCH
        value: "true"

      # ── Worker loop tuning (dashboard/settings.py defaults) ──
      - key: DASHBOARD_HEARTBEAT_SECONDS
        value: "10"
      - key: DASHBOARD_WORKER_POLL_SECONDS
        value: "5"
      - key: DASHBOARD_WORKER_LEASE_SECONDS
        value: "3600"

      # Deliberately ABSENT from the worker:
      #   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / PUBLIC_BASE_URL /
      #   DASHBOARD_SESSION_SECRET — login belongs to the web service only.
      #   IMAP_* / CHECK_INTERVAL_HOURS / MAX_OPPORTUNITIES_PER_RUN /
      #   HEALTHCHECK_URL — discovery-scheduler settings; this worker never
      #   runs discovery (it only calls main.submit_single_url per job).

# ── Not enabled: Render Cron alternative to the systemd timers ───────────────
# The recommendation (docs/DASHBOARD.md) is to leave scheduled discovery where
# it is. If Cortech later decides to move it onto Render, this is the shape —
# uncomment, and decommission the systemd timers so discovery does not run
# twice and double-spend against the cap.
#
#  - type: cron
#    name: cortech-discovery
#    runtime: docker
#    region: frankfurt
#    plan: 1c-2g
#    schedule: "0 */6 * * *"          # CHECK_INTERVAL_HOURS=6
#    dockerfilePath: ./Dockerfile
#    dockerCommand: python main.py --once
#    envVars: (same block as cortech-bd-worker, plus IMAP_* for the newsletter source)
