# Render Blueprint for the Cortech BD dashboard.
#
# ┌─ READ THIS BEFORE CREATING ANY SERVICE BY HAND ────────────────────────────┐
# │ Deploy via Blueprint (New → Blueprint) so the start commands below apply. │
# │ A service created manually with runtime=Docker and NO Start Command runs  │
# │ the Dockerfile CMD. On 2026-09-21 that CMD was `python main.py`, which is │
# │ the always-on discovery scheduler: it ran a full pipeline pass on boot    │
# │ (15 opportunities, 1 draft, review emails) and would have repeated every  │
# │ 6 hours. The CMD is now the queue-only worker and bare main.py refuses to │
# │ start under $PORT/$RENDER, but the rule stands:                           │
# │   web    (type: web)    Docker Command = uvicorn dashboard.app:app … --port $PORT
# │   worker (type: worker) Docker Command = python -m dashboard.worker        │
# │ A worker command under type: web has no port → "No open ports detected"  │
# │ forever, and no UI anywhere (second misconfiguration, 2026-09-21).        │
# │   NEVER `python main.py` in any Render service.                            │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Two services, both stateless — every piece of real state is in the existing
# Supabase project, so either can restart or redeploy without losing anything.
#
#   cortech-bd-dashboard  type: web     the dashboard UI + thin API   (binds $PORT)
#   cortech-bd-worker     type: worker  runs dashboard-triggered jobs  (no port)
#
# Both services build the SAME image from ./Dockerfile and differ only in the
# command — verified 2026-09-21: the image runs `uvicorn dashboard.app:app`
# (port bound, /healthz 200) and `python -m dashboard.worker` (no port). One
# build context means one dependency resolution and no runtime drift.
#
# Nothing here replaces the existing discovery schedule. The systemd timers
# (cortech-discovery / -assortis / -deadline / -winloss / -market) keep running
# wherever they run today; this Blueprint only adds manual triggering. See
# docs/DASHBOARD.md §"Scheduler" for the reasoning and the opt-in Render Cron
# alternative at the bottom of this file.
#
# Compute plans and prices below were read from render.com/pricing on
# 2026-09-21. Re-check before budgeting; Render renamed plans in Aug 2026
# (legacy names still work: starter = 0.5c-512mb, standard = 1c-2g).

services:
  # ── Web service: the dashboard UI + API ─────────────────────────────────────
  # Binds $PORT. This is the ONLY service Render should scan for an open port.
  - type: web
    name: cortech-bd-dashboard
    runtime: docker              # same image as the worker; only the command differs
    region: frankfurt            # closest Render region to the Supabase project (eu-west-1)
    plan: starter                # 0.5 CPU / 512 MB — $7/mo. `free` spins down after 15 idle min.
    branch: main
    dockerfilePath: ./Dockerfile
    # `sh -c` so $PORT (injected by Render) is expanded inside the container.
    dockerCommand: sh -c 'exec uvicorn dashboard.app:app --host 0.0.0.0 --port "${PORT:-10000}" --proxy-headers --forwarded-allow-ips="*"'
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # ── Required: shared with the pipeline (config.require_env validates at import) ──
      - key: SUPABASE_URL
        sync: false               # set in the Render dashboard; never committed
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AIRTABLE_API_KEY
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false

      # ── Required: dashboard auth (WEB ONLY — the worker never sees these) ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true       # Render generates a random value
      - key: PUBLIC_BASE_URL
        sync: false               # https://cortech-bd-dashboard.onrender.com — must equal the
                                  # Google OAuth redirect URI origin exactly

      # ── Optional ──
      - key: AUTH_ALLOWED_DOMAIN
        value: cortechconsultinggroup.com
      - key: AUTH_ALLOWED_EMAILS
        value: ""                 # explicit off-domain exceptions, comma-separated. Empty = domain only.
      - key: DASHBOARD_POLL_MS
        value: "15000"
      - key: DASHBOARD_TRIGGERS_ENABLED
        value: "true"
      - key: DASHBOARD_COOKIE_SECURE
        value: "true"
      # Mirror of the worker's aggregate gate so the UI shows the enforced number.
      # Keep identical on both services.
      - key: DASHBOARD_AGGREGATE_CAP_USD
        value: "100"
      - key: DASHBOARD_AGGREGATE_WINDOW_HOURS
        value: "24"
      - key: DASHBOARD_BULK_MAX
        value: "40"
      - key: DASHBOARD_HEARTBEAT_SECONDS
        value: "10"

  # ── Background worker: executes dashboard-triggered runs ────────────────────
  # `type: worker` = Render Background Worker. No port, no health check, no
  # inbound traffic — Render never port-scans it. Deploying this command under
  # `type: web` produces the endless "No open ports detected" loop (2026-09-21).
  - type: worker
    name: cortech-bd-worker
    runtime: docker
    region: frankfurt
    plan: standard               # 1 CPU / 2 GB — $25/mo FLAT whether 1 or 50 drafts run.
                                 # PLACEHOLDER pending the tier decision (docs/DASHBOARD.md
                                 # §3.6, options A/B/C). Workers have no free tier.
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m dashboard.worker   # also the image's default CMD
    autoDeployTrigger: commit
    envVars:
      # ── Required: the full pipeline environment (identical to a cron run) ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AIRTABLE_API_KEY
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false

      # ── Review email (the existing human-review step at `drafted`) ──
      # submit_single_url() sends the internal review email exactly as the CLI
      # does. Empty EMAIL_RECIPIENTS suppresses it for dashboard AND cron alike.
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_RECIPIENTS
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: RESEND_API_KEY
        sync: false

      # ── Spend caps: per run (ADR 012) and aggregate across dashboard runs ──
      - key: MAX_RUN_COST_USD
        value: "25"
      - key: DASHBOARD_AGGREGATE_CAP_USD
        value: "100"
      - key: DASHBOARD_AGGREGATE_WINDOW_HOURS
        value: "24"

      # ── Optional pipeline tuning (same defaults as .env.example) ──
      - key: ANTHROPIC_TIMEOUT_SECONDS
        value: "180"
      - key: ANTHROPIC_MAX_RETRIES
        value: "2"
      - key: DOCUMENT_DOWNLOAD_TIMEOUT_SECONDS
        value: "60"
      - key: MAX_DOCUMENT_BYTES
        value: "26214400"
      - key: PLAYWRIGHT_TIMEOUT_MS
        value: "45000"
      - key: PLAYWRIGHT_JS_HEAP_MB
        value: "512"
      - key: FULL_DRAFT_FOR_WATCH
        value: "true"

      # ── Optional worker tuning ──
      - key: DASHBOARD_HEARTBEAT_SECONDS
        value: "10"
      - key: DASHBOARD_WORKER_POLL_SECONDS
        value: "5"
      - key: DASHBOARD_WORKER_LEASE_SECONDS
        value: "3600"

# ── Not enabled: Render Cron alternative to the systemd timers ───────────────
