name: ci

on:
  push:
  pull_request:

jobs:
  # Fails while any live credential is reachable in the tree or in history.
  # Values are never printed: our scanner shows fingerprints, gitleaks runs
  # with --redact.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan (working tree)
        run: python scripts/secret_scan.py --tree
      - name: Secret scan (full history, all refs)
        run: python scripts/secret_scan.py --history
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --no-banner --verbose

  test-and-audit:
    runs-on: ubuntu-latest
    # Disposable Postgres for tests/test_queue_scopes_pg.py (atomic claims,
    # queue scopes). Never the hosted Supabase project.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      QUEUE_TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres  # secret-scan: allow (throwaway CI container)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Pytest
        run: python -m pytest tests/ --ignore=tests/test_live_supabase_stages.py --ignore=tests/test_live_supabase_migrations.py --ignore=tests/test_live_dashboard_queue.py -q
